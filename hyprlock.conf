general {
    hide_cursor = true
    immediate_render = true
}

# Background

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8

    brightness = 0.65
    contrast = 0.90
    noise = 0.0117
    vibrancy = 0.15
}


# Clock

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%H:%M")"

    color = rgba(205, 214, 244, 1.0)

    font_size = 70
    font_family = CaskaydiaCove Nerd Font

    position = 0, 150

    halign = center
    valign = center
}


# Date

label {
    monitor =

    text = cmd[update:60000] echo "$(date +"%A, %d %B")"

    color = rgba(205, 214, 244, 0.85)

    font_size = 20
    font_family = CaskaydiaCove Nerd Font

    position = 0, 70

    halign = center
    valign = center
}


# Password field

input-field {
    monitor =

    size = 180, 40

    outline_thickness = 2

    outer_color = rgba(137, 180, 250, 0.85)
    inner_color = rgba(0, 0, 0, 0.15)

    dots_size = 0.18
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1

    font_color = rgb(205, 214, 244)
    font_family = CaskaydiaCove Nerd Font

    fade_on_empty = false
    hide_input = false

    placeholder_text =

    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)

    fail_text = <i>$FAIL</i>

    position = 0, -30

    halign = center
    valign = center
}


# User to login

label {
    monitor =

    text =   $USER

    color = rgba(205, 214, 244, 0.9)

    font_size = 20
    font_family = CaskaydiaCove Nerd Font

    position = 0, 170

    halign = center
    valign = bottom
}
